<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classroom Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.19.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.1.1",
    "recharts": "https://aistudiocdn.com/recharts@^3.2.0"
  }
}
</script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <style>
    body {
        font-family: 'Poppins', sans-serif;
    }
  
    /* Splash Screen Animations */
    @keyframes splash-fade-out {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    /* Login Page Animation */
    @keyframes apple-glass-fade-in {
      from { opacity: 0; transform: scale(0.95) translateY(10px); filter: blur(5px); }
      to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
    }
    .animate-apple-glass-fade-in {
      animation: apple-glass-fade-in 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* New Animations for UI Polish */
    @keyframes content-enter {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .animate-content-enter {
      animation: content-enter 0.4s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
    }

    @keyframes list-item-enter {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-list-item-enter {
      opacity: 0; /* Start hidden */
      animation: list-item-enter 0.5s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
    }

    /* Enhanced Card Hover Effect */
    .card-hover-effect {
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      border-color: transparent;
    }
    .card-hover-effect:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 24px rgba(0,0,0,0.1), 0 8px 8px rgba(0,0,0,0.08);
      border-color: rgba(255, 255, 255, 0.5);
    }
    .dark .card-hover-effect:hover {
       box-shadow: 0 12px 24px rgba(0,0,0,0.3), 0 8px 8px rgba(0,0,0,0.25);
       border-color: rgba(255, 255, 255, 0.2);
    }

    /* Fluid Background Animations */
    @keyframes moveBlob1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(40px, -60px) scale(1.1); }
      50% { transform: translate(-30px, 30px) scale(0.9); }
      75% { transform: translate(60px, 40px) scale(1.2); }
    }
    @keyframes moveBlob2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(-50px, 70px) scale(0.9); }
      50% { transform: translate(40px, -40px) scale(1.1); }
      75% { transform: translate(-60px, -50px) scale(1); }
    }
    @keyframes moveBlob3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -50px) scale(1.2); }
      50% { transform: translate(-40px, 60px) scale(0.8); }
      75% { transform: translate(50px, 30px) scale(1.1); }
    }
  </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body style="font-family: 'Poppins', sans-serif;">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
